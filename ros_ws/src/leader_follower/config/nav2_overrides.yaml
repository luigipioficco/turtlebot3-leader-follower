# Changes to the OFFICIAL Nav2 configuration, which drives the target.
#
# The base file is not copied into this repository: target_nav2.launch.py
# loads the nav2_params.yaml installed with nav2_bringup (Apache-2.0) and
# applies only the keys listed here on top of it. The configuration therefore
# always matches the installed Nav2 version, and everything this project
# changes is visible in this one file.
#
# Why each group of keys changes:
#   frames      the target's frames are prefixed with target/ so they cannot
#               collide with the follower's; the default robot_base_frame is
#               base_link, which the target does not publish at all
#   topics      the defaults use a few absolute names (/odom, /scan,
#               /local_costmap/...) that would point at the FOLLOWER's topics;
#               made relative, they resolve under /target
#   cmd_vel     the target's bridge expects TwistStamped, Nav2 on Jazzy
#               publishes Twist unless enable_stamped_cmd_vel is set
#   velocities  same limits as the custom driver (0.21 m/s, 1.0 rad/s) and no
#               reversing towards the follower
#   footprint   TurtleBot3 Burger instead of the default (TurtleBot4) radius,
#               and a smaller inflation so the paths stay close to the
#               straight legs of the scripted route
#   tolerance   the default GridBased.tolerance (0.5 m) lets the planner
#               satisfy an intermediate pose from up to half a metre away.
#               Several waypoints in trajectory_1 are small deliberate
#               detours to pass close to a fixed marker (e.g. the leg
#               through (0.0, 3.0) / (-0.6, 3.0), only 0.6 m off the main
#               axis, written to go near the marker at (0.0, 3.94)); at the
#               default tolerance the planner cuts across them instead of
#               visiting them, because the resulting path is shorter and
#               avoids the inflated cost near the wall. Tightened so each
#               waypoint is actually approached.
#
# The initial pose of AMCL is NOT written here: the launch file takes it from
# worlds.TARGET_SPAWN, the same source the simulation spawns from.

amcl:
  ros__parameters:
    base_frame_id: "target/base_footprint"
    odom_frame_id: "target/odom"
    laser_max_range: 3.5
    set_initial_pose: true

bt_navigator:
  ros__parameters:
    robot_base_frame: target/base_footprint
    odom_topic: odom

planner_server:
  ros__parameters:
    GridBased:
      tolerance: 0.15

controller_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    FollowPath:
      vx_max: 0.21
      vx_min: 0.0
      wz_max: 1.0

local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: target/odom
      robot_base_frame: target/base_footprint
      robot_radius: 0.105
      inflation_layer:
        inflation_radius: 0.35
      voxel_layer:
        scan:
          topic: scan

global_costmap:
  global_costmap:
    ros__parameters:
      robot_base_frame: target/base_footprint
      robot_radius: 0.105
      obstacle_layer:
        scan:
          topic: scan
      inflation_layer:
        inflation_radius: 0.35

behavior_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    local_frame: target/odom
    robot_base_frame: target/base_footprint

velocity_smoother:
  ros__parameters:
    enable_stamped_cmd_vel: true
    max_velocity: [0.21, 0.0, 1.0]
    # a little reverse is left to the smoother so the BackUp recovery can
    # still work; the controller itself never commands it (vx_min: 0.0)
    min_velocity: [-0.10, 0.0, -1.0]

collision_monitor:
  ros__parameters:
    enable_stamped_cmd_vel: true
    base_frame_id: "target/base_footprint"
    odom_frame_id: "target/odom"
    FootprintApproach:
      footprint_topic: "local_costmap/published_footprint"

docking_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    base_frame: "target/base_footprint"
    fixed_frame: "target/odom"
