# gz <-> ROS bridge for the TARGET robot.
# Only the velocity command and the pose the driver needs to follow its
# waypoints.
# The target's TF is deliberately NOT carried onto /tf: its DiffDrive plugin
# produces frames with the same names as the follower's, and publishing both
# would make every lookup resolve non-deterministically.

- ros_topic_name: "/target/cmd_vel"
  gz_topic_name: "/target/cmd_vel"
  ros_type_name: "geometry_msgs/msg/TwistStamped"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

- ros_topic_name: "/target/odom"
  gz_topic_name: "/target/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

# The two entries below are used by Nav2, which drives the target.
#
# LiDAR of the target, for AMCL and the costmaps.
- ros_topic_name: "/target/scan"
  gz_topic_name: "/target/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

# The target's own TF tree (target/odom -> target/base_footprint), kept on
# /target/tf and never on /tf, for the reason given at the top of this file.
# Nav2 runs in the /target namespace and reads its TF from here.
- ros_topic_name: "/target/tf"
  gz_topic_name: "/target/tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS
